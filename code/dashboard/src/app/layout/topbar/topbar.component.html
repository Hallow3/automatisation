<header class="h-14 sm:h-16 lg:h-[72px] bg-white/90 backdrop-blur-md border-b border-brand-100/80 flex items-center justify-between px-3 sm:px-6 lg:px-8 sticky top-0 z-20">
  <!-- Left Greeting -->
  <div class="flex items-center gap-2 sm:gap-3 min-w-0">
    <!-- Mobile hamburger -->
    <button
      type="button"
      (click)="openNav.emit()"
      aria-label="Ouvrir le menu"
      class="lg:hidden p-1.5 sm:p-2 rounded-lg sm:rounded-xl text-slate-500 hover:bg-brand-50 hover:text-brand-600 transition shrink-0">
      <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12" stroke-linecap="round"/>
        <line x1="3" y1="6" x2="21" y2="6" stroke-linecap="round"/>
        <line x1="3" y1="18" x2="21" y2="18" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="min-w-0">
      <h1 class="text-xs sm:text-base font-bold text-slate-900 leading-tight truncate">
        Bonjour {{ firstName }} <span class="inline-block">👋</span>
      </h1>
      <p class="hidden sm:block text-[11px] sm:text-xs text-slate-400 truncate mt-0.5">Activité de recherche d’emploi</p>
    </div>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-1.5 sm:gap-3 lg:gap-4 shrink-0">
    <!-- Search Bar (Desktop) -->
    <div class="relative hidden md:block">
      <svg class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-400 h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        placeholder="Rechercher une offre, entreprise..."
        class="w-60 lg:w-80 pl-10 pr-4 py-2 lg:py-2.5 rounded-xl bg-brand-50/60 border border-transparent focus:border-brand-300 focus:bg-white focus:outline-none text-xs lg:text-sm placeholder:text-slate-400 transition" />
    </div>

    <!-- Notification Bell -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu('notifications')"
        aria-label="Notifications"
        class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl bg-brand-50/80 hover:bg-brand-100/80 flex items-center justify-center relative transition text-brand-600">
        <svg class="h-4 w-4 sm:h-4.5 sm:w-4.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="absolute top-1.5 right-1.5 sm:top-2 sm:right-2 w-1.5 h-1.5 sm:w-2 sm:h-2 bg-brand-500 rounded-full ring-2 ring-white"></span>
      </button>

      <!-- Notifications Dropdown -->
      <div
        *ngIf="openMenu() === 'notifications'"
        class="absolute right-0 top-10 sm:top-12 w-72 sm:w-80 overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-pop z-50 animate-fade-in">
        <div class="border-b border-brand-100 px-4 py-2.5 bg-brand-50/50">
          <p class="text-2xs sm:text-xs font-bold text-slate-900 uppercase tracking-wider">Notifications</p>
        </div>
        <ul class="divide-y divide-brand-50 max-h-72 overflow-y-auto">
          <li *ngFor="let item of notifications" class="px-4 py-2.5 hover:bg-brand-50/50 transition">
            <p class="text-xs font-bold text-slate-800">{{ item.title }}</p>
            <p class="text-2xs sm:text-xs text-slate-400 mt-0.5">{{ item.detail }}</p>
            <span class="text-2xs text-brand-500 font-semibold mt-1 block">{{ item.time }}</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- User Profile Dropdown Menu with Logout -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu('user')"
        aria-label="Menu utilisateur"
        class="flex items-center gap-1 rounded-lg sm:rounded-xl p-0.5 hover:bg-slate-100 transition">
        <span class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl bg-gradient-to-br from-brand-600 to-brand-800 text-white font-bold text-xs sm:text-sm flex items-center justify-center shadow-2xs">
          {{ initials }}
        </span>
        <svg class="h-3.5 w-3.5 text-slate-400 hidden sm:block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <!-- User Dropdown Menu -->
      <div
        *ngIf="openMenu() === 'user'"
        class="absolute right-0 top-10 sm:top-12 w-56 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-pop z-50 animate-fade-in">
        <div class="border-b border-slate-100 px-4 py-3 bg-slate-50/60">
          <p class="text-xs font-bold text-slate-900 truncate">{{ currentUser()?.fullName || 'Utilisateur' }}</p>
          <p class="text-2xs text-slate-500 truncate mt-0.5">{{ currentUser()?.email || 'email@exemple.com' }}</p>
        </div>
        <div class="p-1.5 space-y-0.5">
          <a
            routerLink="/profile"
            (click)="closeMenus()"
            class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">
            <svg class="h-4 w-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Mon Profil
          </a>
          <a
            routerLink="/settings"
            (click)="closeMenus()"
            class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">
            <svg class="h-4 w-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Paramètres
          </a>
          <button
            type="button"
            (click)="logout()"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 hover:bg-rose-50 transition border-t border-slate-100">
            <svg class="h-4 w-4 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Se déconnecter
          </button>
        </div>
      </div>
    </div>

    <!-- Nouvelle candidature CTA (Sleek icon on mobile, full button on desktop) -->
    <a
      routerLink="/opportunities"
      aria-label="Nouvelle candidature"
      title="Nouvelle candidature"
      class="flex items-center justify-center gap-1.5 sm:gap-2 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 text-white text-xs sm:text-sm font-semibold w-8 h-8 sm:w-auto sm:px-3.5 sm:py-2 rounded-lg sm:rounded-xl transition shadow-2xs sm:shadow-brand shrink-0">
      <svg class="h-4 w-4 sm:h-3.5 sm:w-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span class="hidden sm:inline">Nouvelle candidature</span>
    </a>
  </div>
</header>
