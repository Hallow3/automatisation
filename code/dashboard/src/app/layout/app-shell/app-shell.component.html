<div class="flex min-h-screen w-full bg-[#f2f3fc] text-slate-800 antialiased">
  <!-- Desktop Sidebar (264px) -->
  <div class="hidden lg:block w-[264px] shrink-0">
    <div class="sticky top-0 h-screen">
      <app-sidebar />
    </div>
  </div>

  <!-- Mobile Sidebar Drawer -->
  <div *ngIf="navOpen()" class="fixed inset-0 z-50 lg:hidden">
    <div class="absolute inset-0 bg-brand-950/60 backdrop-blur-sm" (click)="closeNav()"></div>
    <div class="relative h-full w-[264px] shadow-pop">
      <button
        type="button"
        (click)="closeNav()"
        aria-label="Fermer la navigation"
        class="absolute right-3 top-4 z-10 rounded-lg p-1.5 text-white/70 hover:bg-white/10 hover:text-white transition">
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <app-sidebar (linkClicked)="closeNav()" />
    </div>
  </div>

  <!-- Main Content Column -->
  <div class="flex min-w-0 flex-1 flex-col">
    <app-topbar (openNav)="openNav()" />
    <main class="flex-1 min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Global Top-Level Forfaits & Credits Modal -->
<app-agent-pack-modal
  [open]="paymentService.isPackModalOpen()"
  (close)="paymentService.closePackModal()">
</app-agent-pack-modal>
