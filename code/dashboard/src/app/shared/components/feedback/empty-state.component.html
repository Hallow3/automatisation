<div [class]="'flex flex-col items-center justify-center rounded-xl border border-dashed border-line-strong bg-surface px-6 py-10 text-center ' + customClass">
  <span class="flex h-10 w-10 items-center justify-center rounded-lg border border-line bg-slate-50">
    <svg *ngIf="iconType === 'search'" class="h-5 w-5 text-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      <line x1="8" y1="8" x2="14" y2="14"/>
      <line x1="14" y1="8" x2="8" y2="14"/>
    </svg>
    <svg *ngIf="iconType === 'inbox'" class="h-5 w-5 text-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
      <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
    </svg>
    <svg *ngIf="iconType === 'file'" class="h-5 w-5 text-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    <svg *ngIf="iconType === 'mail'" class="h-5 w-5 text-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </svg>
    <svg *ngIf="iconType === 'default'" class="h-5 w-5 text-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </span>

  <h3 class="mt-3 text-sm font-semibold text-ink">{{ title }}</h3>
  <p class="mt-1 max-w-sm text-[13px] leading-relaxed text-muted">{{ description }}</p>

  <div *ngIf="actionLabel" class="mt-4 flex items-center gap-2">
    <app-button variant="primary" size="sm" (btnClick)="actionClick.emit()">
      {{ actionLabel }}
    </app-button>
    <app-button *ngIf="secondaryLabel" variant="ghost" size="sm" (btnClick)="secondaryClick.emit()">
      {{ secondaryLabel }}
    </app-button>
  </div>
</div>
