<span
  [class]="'inline-flex items-center justify-center font-bold rounded-full ' + tone + ' ' + (size === 'lg' ? 'px-3 py-1 text-sm' : 'px-2 py-0.5 text-xs')">
  <span *ngIf="!isPublic" class="tabular-nums">{{ score }}%</span>
  <span *ngIf="isPublic" class="tabular-nums font-semibold">Public</span>
  <span *ngIf="withLabel" class="ml-1.5 font-medium opacity-90">· {{ label }}</span>
</span>
