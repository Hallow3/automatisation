<article [class]="'group flex h-full flex-col rounded-2xl border border-brand-100 bg-white p-5 hover:border-brand-200 hover:shadow-md transition-all duration-150 ' + customClass">
  <!-- Top header -->
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="mb-2 flex flex-wrap items-center gap-1.5">
        <app-status-badge [status]="opportunity.status" />
        <span *ngIf="opportunity.source" class="text-2xs font-semibold px-2 py-0.5 rounded-md bg-brand-50 text-brand-600">
          {{ opportunity.source }}
        </span>
      </div>
      <h3 class="line-clamp-2 text-base font-bold tracking-tight text-slate-900">
        <a [routerLink]="['/opportunities', opportunity.id]" class="hover:text-brand-600 transition">
          {{ opportunity.title }}
        </a>
      </h3>
      <p class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-400 font-medium">
        <span class="inline-flex items-center gap-1.5 font-semibold text-slate-700">
          <svg class="h-3.5 w-3.5 text-brand-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
          {{ opportunity.company }}
        </span>
        <span *ngIf="opportunity.city" class="inline-flex items-center gap-1.5">
          <svg class="h-3.5 w-3.5 text-brand-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          {{ opportunity.city }}
        </span>
      </p>
    </div>
    <app-score-badge [score]="opportunity.score" />
  </div>

  <!-- AI Explanation Quote -->
  <div *ngIf="matchExplanationText" class="mt-3.5 rounded-xl border border-brand-100 bg-brand-50/50 p-3">
    <p class="text-xs font-bold text-brand-700 flex items-center gap-1.5">
      <svg class="h-3.5 w-3.5 text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Pourquoi cette offre ?
    </p>
    <p class="mt-1 text-xs leading-relaxed text-slate-700">
      {{ matchExplanationText }}
    </p>
  </div>

  <!-- Skills Chips -->
  <div *ngIf="skillsList.length > 0" class="mt-3 flex flex-wrap gap-1.5">
    <span *ngFor="let skill of skillsList.slice(0, 4)" class="text-[11px] px-2 py-0.5 rounded-md bg-brand-50 text-brand-600 font-medium">
      {{ skill }}
    </span>
  </div>

  <!-- Footer actions -->
  <div class="mt-auto flex flex-wrap items-center justify-between gap-2 pt-4 border-t border-brand-50">
    <span class="inline-flex items-center gap-1.5 text-xs text-slate-400">
      <svg class="h-3.5 w-3.5 text-brand-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      {{ opportunity.coverLetterAvailable ? 'Lettre prête' : 'Lettre à générer' }}
    </span>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="onDismiss($event)"
        aria-label="Ignorer cette opportunité"
        class="inline-flex items-center justify-center px-2.5 py-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 rounded-lg hover:bg-brand-50 transition">
        Ignorer
      </button>

      <a
        [routerLink]="['/opportunities', opportunity.id]"
        class="hidden h-8 items-center rounded-xl border border-brand-100 bg-white px-3 text-xs font-semibold text-slate-700 hover:bg-brand-50 hover:border-brand-200 transition sm:inline-flex shadow-sm">
        Voir le détail
      </a>

      <button
        type="button"
        (click)="onPrepare($event)"
        class="inline-flex h-8 items-center justify-center rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 px-3.5 text-xs font-semibold text-white shadow-brand transition">
        Préparer
      </button>
    </div>
  </div>
</article>
