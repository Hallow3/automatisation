<div class="cv-scale-wrapper" [class.pagination-pending]="paginationPending" [style.transform]="scale !== 1 ? 'scale(' + scale + ')' : null" [style.transformOrigin]="'top center'">
  <div *ngFor="let page of pages; let index = index" #pageSheet class="cv-page-sheet-container">
    <ng-container *ngComponentOutlet="activeComponent; inputs: inputsFor(page)" />
    <span *ngIf="showPageBreaks" class="cv-page-number">Page {{ index + 1 }}</span>
  </div>
</div>
