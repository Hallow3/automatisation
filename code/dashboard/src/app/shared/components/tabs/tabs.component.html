<div class="flex items-center gap-1 overflow-x-auto border-b border-brand-100 scroll-slim">
  <button
    *ngFor="let item of items"
    type="button"
    (click)="selectTab(item.id)"
    [class]="'flex items-center gap-2 whitespace-nowrap border-b-2 px-3.5 py-3 text-xs font-semibold transition-colors ' + (value === item.id ? 'border-brand-600 text-brand-700 font-bold' : 'border-transparent text-slate-500 hover:border-brand-200 hover:text-slate-800')">
    <span>{{ item.label }}</span>
    <span
      *ngIf="item.count !== undefined"
      [class]="'rounded-full px-2 py-0.5 text-2xs font-bold ' + (value === item.id ? 'bg-brand-100 text-brand-700 ring-1 ring-brand-300/40' : 'bg-slate-100 text-slate-500')">
      {{ item.count }}
    </span>
  </button>
</div>
