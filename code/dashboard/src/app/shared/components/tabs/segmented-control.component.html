<div class="inline-flex rounded-xl border border-brand-100 bg-brand-50/60 p-1" [attr.aria-label]="ariaLabel">
  <button
    *ngFor="let item of items"
    type="button"
    (click)="select(item.id)"
    [class]="'flex items-center gap-1.5 rounded-lg px-3 py-1 text-xs font-semibold transition-all ' + (value === item.id ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500 hover:text-slate-800')">
    <svg *ngIf="item.icon === 'grid'" class="h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
    </svg>
    <svg *ngIf="item.icon === 'list'" class="h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <line x1="8" y1="6" x2="21" y2="6"/>
      <line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/>
      <line x1="3" y1="12" x2="3.01" y2="12"/>
      <line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
    <span>{{ item.label }}</span>
  </button>
</div>
