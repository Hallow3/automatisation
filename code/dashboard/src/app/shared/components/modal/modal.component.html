<div *ngIf="open" class="fixed inset-0 z-[9999] flex items-center justify-center p-4" role="dialog" aria-modal="true" [attr.aria-label]="title">
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity duration-200"
    (click)="onClose()">
  </div>

  <!-- Modal / Drawer Content -->
  <div
    [class]="'relative z-[10000] flex flex-col overflow-hidden border-line bg-surface shadow-pop transition-all duration-200 ' + 
             (variant === 'drawer' ? 'ml-auto h-full w-full max-w-md border-l ' : 'm-auto max-h-[85vh] w-full max-w-lg rounded-xl border ') + 
             customClass">
    
    <!-- Header -->
    <div class="flex items-start justify-between gap-4 border-b border-line px-5 py-3.5">
      <div class="min-w-0">
        <h2 class="text-[15px] font-semibold text-ink">{{ title }}</h2>
        <p *ngIf="description" class="mt-0.5 text-[13px] text-muted">{{ description }}</p>
      </div>
      <button
        type="button"
        (click)="onClose()"
        aria-label="Fermer"
        class="rounded p-1 text-muted transition-colors duration-150 ease-out hover:bg-slate-100 hover:text-ink">
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="scroll-slim flex-1 overflow-y-auto px-5 py-4">
      <ng-content></ng-content>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-2 border-t border-line bg-slate-50/70 px-5 py-3">
      <ng-content select="[footer]"></ng-content>
    </div>
  </div>
</div>
