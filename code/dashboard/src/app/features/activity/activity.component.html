<div class="space-y-4 sm:space-y-6 p-3 sm:p-6 lg:p-8 max-w-full overflow-hidden">
  <!-- Header -->
  <div>
    <h1 class="text-lg sm:text-xl font-bold text-slate-900 truncate">Journal d’activité</h1>
    <p class="text-xs text-slate-400 mt-0.5 truncate">L’historique chronologique des détections, qualifications et candidatures.</p>
  </div>

  <!-- Timeline Card -->
  <div class="rounded-xl sm:rounded-2xl border border-brand-100 bg-white shadow-sm overflow-hidden">
    <div class="border-b border-brand-100 px-3 pt-1">
      <app-tabs
        [items]="tabs"
        [value]="activeTab"
        (tabChange)="setTab($event)" />
    </div>

    <div *ngIf="filteredRecords.length === 0" class="p-8 text-center">
      <app-empty-state
        iconType="inbox"
        title="Aucune activité récente"
        description="L'historique de vos candidatures et détections apparaîtra au fur et à mesure." />
    </div>

    <ol class="divide-y divide-brand-50" *ngIf="filteredRecords.length > 0">
      <li *ngFor="let item of filteredRecords" class="flex items-start gap-2.5 sm:gap-3.5 p-3.5 sm:p-4 hover:bg-brand-50/40 transition">
        <span class="mt-0.5 flex h-7 w-7 sm:h-8 sm:w-8 shrink-0 items-center justify-center rounded-lg border border-brand-100 bg-brand-50 text-brand-600 shadow-sm">
          <svg *ngIf="item.type === 'opportunite'" class="h-3.5 w-3.5 sm:h-4 sm:w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <svg *ngIf="item.type === 'lettre'" class="h-3.5 w-3.5 sm:h-4 sm:w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
          </svg>
          <svg *ngIf="item.type === 'candidature'" class="h-3.5 w-3.5 sm:h-4 sm:w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <svg *ngIf="item.type === 'entretien'" class="h-3.5 w-3.5 sm:h-4 sm:w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </span>

        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
            <p class="text-xs sm:text-sm font-bold text-slate-900 truncate">{{ item.title }}</p>
            <span *ngIf="item.automated" class="rounded bg-brand-50 text-brand-700 px-1.5 py-0.5 text-2xs font-bold ring-1 ring-brand-200/50">
              Automatique
            </span>
            <span *ngIf="!item.automated" class="rounded bg-slate-100 text-slate-600 px-1.5 py-0.5 text-2xs font-medium">
              Votre action
            </span>
          </div>
          <p class="mt-0.5 text-2xs sm:text-xs text-slate-500 leading-relaxed break-words">{{ item.detail }}</p>
        </div>

        <span class="shrink-0 text-2xs text-slate-400 tabular-nums">{{ item.time }}</span>
      </li>
    </ol>
  </div>
</div>
