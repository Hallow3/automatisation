<div class="space-y-4 sm:space-y-6 p-3 sm:p-6 lg:p-8 max-w-full overflow-hidden">
  <!-- Header -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
      <h1 class="text-lg sm:text-xl font-bold text-slate-900 truncate">Documents générés</h1>
      <p class="text-xs text-slate-400 mt-0.5 truncate">Retrouvez et téléchargez vos CV et lettres de motivation.</p>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <a
        routerLink="/cv-builder"
        class="inline-flex h-8 sm:h-9 items-center justify-center gap-1.5 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 px-3.5 text-xs sm:text-sm font-semibold text-white shadow-brand transition">
        + Nouveau document
      </a>
    </div>
  </div>

  <!-- Card container with Table -->
  <div class="rounded-xl sm:rounded-2xl border border-brand-100 bg-white shadow-sm overflow-hidden">
    <div *ngIf="documents.length === 0" class="p-6 sm:p-8">
      <app-empty-state
        iconType="inbox"
        title="Aucun document généré"
        description="Vos CV et lettres de motivation exportés apparaîtront dans cette liste." />
    </div>

    <!-- Table view -->
    <div *ngIf="documents.length > 0" class="overflow-x-auto">
      <table class="w-full min-w-[800px] border-collapse text-left">
        <thead>
          <tr class="border-b border-brand-100 bg-brand-50/40 text-2xs uppercase tracking-wider text-slate-400">
            <th scope="col" class="px-4 py-3 font-bold">Document</th>
            <th scope="col" class="px-4 py-3 font-bold">Type</th>
            <th scope="col" class="px-4 py-3 font-bold">Opportunité associée</th>
            <th scope="col" class="px-4 py-3 font-bold">Date</th>
            <th scope="col" class="px-4 py-3 font-bold">Statut</th>
            <th scope="col" class="px-4 py-3 text-right font-bold">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-brand-50">
          <tr *ngFor="let doc of documents" class="transition hover:bg-brand-50/40">
            <td class="px-4 py-3">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="flex h-8 w-8 items-center justify-center rounded-lg border border-brand-100 bg-brand-50 text-brand-600 shrink-0">
                  <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                  </svg>
                </span>
                <div class="min-w-0">
                  <p class="text-xs sm:text-sm font-bold text-slate-900 truncate">{{ doc.name }}</p>
                  <p class="text-2xs text-slate-400 truncate">{{ doc.size }}</p>
                </div>
              </div>
            </td>
            <td class="px-4 py-3">
              <span class="text-2xs font-semibold px-2 py-0.5 rounded-full bg-brand-50 text-brand-600">
                {{ doc.type === 'cv' ? 'Curriculum Vitae' : 'Lettre de motivation' }}
              </span>
            </td>
            <td class="px-4 py-3 text-xs font-semibold text-slate-700 truncate max-w-xs">
              {{ doc.target }}
            </td>
            <td class="whitespace-nowrap px-4 py-3 text-xs tabular-nums text-slate-400">
              {{ doc.date }}
            </td>
            <td class="px-4 py-3">
              <app-status-badge [status]="doc.status" />
            </td>
            <td class="px-4 py-3 text-right">
              <button
                type="button"
                class="inline-flex h-8 items-center rounded-lg border border-brand-100 bg-white px-2.5 text-xs font-semibold text-slate-700 hover:bg-brand-50 shadow-sm transition">
                Télécharger PDF
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
