server:
  port: 8081
  servlet:
    context-path: /

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

spring:
  application:
    name: getjob-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:emploi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    repair-on-migrate: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

google:
  client-id: ${GOOGLE_CLIENT_ID:}

mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:}

openai:
  api-key: ${OPENAI_API_KEY:}

gemini:
  api-keys: ${GEMINI_API_KEYS:}
  api-key: ${GEMINI_API_KEY:}
  live:
    model: ${GEMINI_LIVE_MODEL:gemini-2.0-flash-live-001}
# jwt.cookie.secure : true en production (HTTPS obligatoire), false en dev (HTTP).
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}

logging:
  level:
    root: INFO
    com.getjob.backend: DEBUG
