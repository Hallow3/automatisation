server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: native
  servlet:
    context-path: /

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

spring:
  application:
    name: fallajobs-backend
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:emploi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    repair-on-migrate: ${FLYWAY_REPAIR_ON_MIGRATE:false}
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false

google:
  client-id: ${GOOGLE_CLIENT_ID:1046640865115-asaoa8pbuhhfhkf5kfd7uk1epvta9m1l.apps.googleusercontent.com}

mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:}

openai:
  api-key: ${OPENAI_API_KEY:}

gemini:
  api-keys: ${GEMINI_API_KEYS:}
  api-key: ${GEMINI_API_KEY:}
  live:
    model: ${GEMINI_LIVE_MODEL:gemini-3.1-flash-live-preview}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

payment:
  gateway: ${PAYMENT_GATEWAY:notchpay}
  return-url: ${PAYMENT_RETURN_URL:http://localhost:4200/cv-builder}
  whatsapp:
    phone: ${WHATSAPP_SUPPORT_PHONE:237698765588}
  notchpay:
    base-url: ${NOTCHPAY_BASE_URL:https://api.notchpay.co}
    public-key: ${NOTCHPAY_PUBLIC_KEY:}
    private-key: ${NOTCHPAY_PRIVATE_KEY:${NOTCHPAY_SECRET_KEY:}}
    webhook-secret: ${NOTCHPAY_WEBHOOK_SECRET:}
    connect-timeout-ms: ${NOTCHPAY_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${NOTCHPAY_READ_TIMEOUT_MS:5000}
    max-retries: ${NOTCHPAY_MAX_RETRIES:2}
    circuit-breaker:
      failure-threshold: ${NOTCHPAY_CB_FAILURE_THRESHOLD:3}
      wait-duration-in-open-ms: ${NOTCHPAY_CB_OPEN_DURATION_MS:60000}

# jwt.cookie.secure : true en production (HTTPS obligatoire), false en dev (HTTP).
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:8080}

logging:
  level:
    root: INFO
    com.getjob.backend: ${LOG_LEVEL_APP:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info

