services:
  fallajobs-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fallajobs-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - FRONTEND_URL=http://fallajobs-frontend
    env_file:
      - ./backend/.env
    networks:
      - app-network

  fallajobs-frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fallajobs-frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - fallajobs-backend
    networks:
      - app-network

networks:
  app-network:
    external: true
