services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    expose:
      - "5678"

    environment:
      N8N_HOST: n8n.jurinex.cloud
      N8N_PORT: 5678
      N8N_PROTOCOL: https

      GENERIC_TIMEZONE: Africa/Douala

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"

      N8N_WEBHOOK_URL: https://n8n.jurinex.cloud/

      N8N_PROXY_HOPS: 1

      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 2147483648
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 5000

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network

  weasyprint:
    image: python:3.12-slim
    container_name: weasyprint
    restart: unless-stopped
    command: |
      sh -c "apt-get update && apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info && pip install weasyprint flask --quiet && python -c \"
      from flask import Flask, request, send_file
      import weasyprint, io
      app = Flask(__name__)
      @app.route('/pdf', methods=['POST'])
      def pdf():
          html = request.data.decode()
          buf = io.BytesIO()
          weasyprint.HTML(string=html).write_pdf(buf)
          buf.seek(0)
          return send_file(buf, mimetype='application/pdf')
      app.run(host='0.0.0.0', port=5000)
      \""
    expose:
      - "5000"
    networks:
      - app-network

  # --- OLLAMA (optionnel — décommenter si ton VPS a 16 Go+ RAM) ---
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - app-network

volumes:
  n8n_data:
    external: true
  redis_data:
  # ollama_data:

networks:
  app-network:
    external: true
